## Installation ##
Set variabels :
MONIKER=<YOUR_MONIKER_NAME>
echo "export MONIKER=$MONIKER" >> $HOME/.bash_profile
echo "export ATOMONE_CHAIN_ID="atomone-1"" >> $HOME/.bash_profile
echo "export ATOMONE_PORT="12"" >> $HOME/.bash_profile
source $HOME/.bash_profile

## End Installation ##

